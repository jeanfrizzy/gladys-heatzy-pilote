name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump version (package.json + manifest)
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          NEW=$(node -p "require('./package.json').version")
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          NEW="$NEW" IMAGE="$IMAGE" node -e '
            const fs = require("fs");
            const f = "gladys-assistant-integration.json";
            const m = JSON.parse(fs.readFileSync(f, "utf8"));
            m.version = process.env.NEW;
            m.docker_image = process.env.IMAGE + ":" + process.env.NEW;
            fs.writeFileSync(f, JSON.stringify(m, null, 2) + "\n");
          '
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.bump.outputs.image }}:${{ steps.bump.outputs.version }}
            ${{ steps.bump.outputs.image }}:latest
